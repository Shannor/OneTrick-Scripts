name: server_tick_sessions_processed
description: "Number of active sessions processed per tick"
filter: 'resource.type="cloud_run_job" AND resource.labels.job_name="server-tick" AND jsonPayload.message="server_tick_completed"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
valueExtractor: "EXTRACT(jsonPayload.sessionsProcessed)"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 15
    growthFactor: 2
    scale: 1
