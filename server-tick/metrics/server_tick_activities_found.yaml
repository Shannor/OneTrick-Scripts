name: server_tick_activities_found
description: "Total activities found and ingested per tick"
filter: 'resource.type="cloud_run_job" AND resource.labels.job_name="server-tick" AND jsonPayload.message="server_tick_completed"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
valueExtractor: "EXTRACT(jsonPayload.activitiesFoundTotal)"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 15
    growthFactor: 2
    scale: 1
