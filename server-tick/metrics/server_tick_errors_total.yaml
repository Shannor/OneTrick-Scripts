name: server_tick_errors_total
description: "Total count of errors encountered during a tick run"
filter: 'resource.type="cloud_run_job" AND resource.labels.job_name="server-tick" AND jsonPayload.job="server-tick"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
valueExtractor: "EXTRACT(jsonPayload.jobMetadata.errorsTotal)"
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 15
    growthFactor: 2
    scale: 1
